apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
      - name: valkey
        image: valkey/valkey:8.0-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-service
  namespace: default
spec:
  selector:
    app: valkey
  ports:
  - port: 6379
    targetPort: 6379
