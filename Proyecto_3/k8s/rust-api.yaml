apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust-api
  template:
    metadata:
      labels:
        app: rust-api
    spec:
      containers:
      - name: rust-api
        image: localhost:5001/api-rust:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: rust-api-service
  namespace: default
spec:
  selector:
    app: rust-api
  ports:
  - port: 8080
    targetPort: 8080