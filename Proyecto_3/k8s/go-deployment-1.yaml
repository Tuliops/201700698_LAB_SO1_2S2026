apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-d1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-d1
  template:
    metadata:
      labels:
        app: go-d1
    spec:
      containers:
      # Contenedor 1: API HTTP
      - name: api
        image: localhost:5001/go-d1-api:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
      # Contenedor 2: Cliente gRPC
      - name: grpc-client
        image: localhost:5001/go-d1-grpc:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: go-d1-service
spec:
  selector:
    app: go-d1
  ports:
  - port: 8081
    targetPort: 8081