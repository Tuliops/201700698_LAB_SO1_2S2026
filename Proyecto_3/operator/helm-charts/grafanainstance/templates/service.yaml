apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-grafana-service
  labels:
    app: {{ .Release.Name }}-grafana
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: 3000
    protocol: TCP
  selector:
    app: {{ .Release.Name }}-grafana
