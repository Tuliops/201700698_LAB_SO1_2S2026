replicaCount: 1

image:
  repository: grafana/grafana
  tag: "10.4.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

adminPassword: "admin"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

# URL del Valkey creado por el Operator
valkeyHost: "my-valkey-valkey-service:6379"
