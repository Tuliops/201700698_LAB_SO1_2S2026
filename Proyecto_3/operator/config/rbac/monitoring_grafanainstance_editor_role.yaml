# permissions for end users to edit grafanainstances.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: operator
    app.kubernetes.io/managed-by: kustomize
  name: monitoring-grafanainstance-editor-role
rules:
- apiGroups:
  - monitoring.mumnk8s.local
  resources:
  - grafanainstances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - monitoring.mumnk8s.local
  resources:
  - grafanainstances/status
  verbs:
  - get
