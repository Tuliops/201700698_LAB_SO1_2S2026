# permissions for end users to view valkeyinstances.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: valkeyinstance-viewer-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: valkey-operator
    app.kubernetes.io/part-of: valkey-operator
    app.kubernetes.io/managed-by: kustomize
  name: valkeyinstance-viewer-role
rules:
- apiGroups:
  - cache.sopes1.com
  resources:
  - valkeyinstances
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cache.sopes1.com
  resources:
  - valkeyinstances/status
  verbs:
  - get
