# permissions for end users to edit valkeyinstances.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: valkeyinstance-editor-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: valkey-operator
    app.kubernetes.io/part-of: valkey-operator
    app.kubernetes.io/managed-by: kustomize
  name: valkeyinstance-editor-role
rules:
- apiGroups:
  - cache.sopes1.com
  resources:
  - valkeyinstances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cache.sopes1.com
  resources:
  - valkeyinstances/status
  verbs:
  - get
